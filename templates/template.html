    rel="stylesheet">

  <title>PDF Content</title>
  <style>
    @page {
      margin: 0;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Anek Gujarati', Arial, sans-serif;
      font-size: 62.5%;
      background-color: white;
      /* Ensure background is solid */
    }

    .wrapper {
      position: relative;
      margin: 0;
      padding: 0;
      width: 100%;
      display: block;
      /* Removing inline extra space */
    }

    h1 {
      color: #333;
    }

    img {
      width: 100%;
      /* Force image to take full width */
      display: block;
      /* Remove space under images */
      page-break-after: always;
      margin: 0;
      padding: 0;
      border: none;
    }

    .user-name {
      position: absolute;
      top: 57%;
      /* Estimated vertical center of the પ.ભ.શ્રી line */
      left: 63%;
      /* Start of the blank line */
      z-index: 11;
      font-size: 45px;
      /* Scaled up for 1550px tall images */
      color: #e63946;
      margin: 0;
      white-space: nowrap;
      transform: translateY(-50%);
      /* font-weight: 600; */
      font-size: 16px;
    }

    /* Fix for the last image to not create an extra blank page */
    img:last-of-type {
      page-break-after: avoid;
    }
  </style>
</head>
